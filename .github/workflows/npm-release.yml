name: npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: npm-release
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use trusted-publishing npm version
        run: npm install --global npm@11.18.0
      - name: Verify protected tag and main ancestry
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          # Full history: a shallow fetch of main sees only its tip, so a tag on the merge commit
          # one below the tip (the v1.0.0-alpha.1 release) is wrongly reported as not on main.
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build
        run: |
          npm run typecheck
          npm test
      - name: Pack and inspect exact artifact
        run: |
          npm pack --json --ignore-scripts > pack.json
          node scripts/verify-pack.mjs pack.json > pack-inventory.json
          node scripts/clean-install-canary.mjs "$(node -p "require('./pack.json')[0].filename")"
      - name: Publish immutable version through OIDC
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="$(node -p "require('./pack.json')[0].filename")"
          # A pre-release (1.0.0-alpha.1) is published under the `next` dist-tag so that a plain
          # `npm install --global @arpadtamasi/kotta` keeps resolving to the last stable release.
          case "${VERSION}" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already exists; verifying the immutable artifact."
          else
            npm publish "${TARBALL}" --access public --tag "${DIST_TAG}"
          fi
          REGISTRY_VERSION=""
          # A provenance-signed publish took more than a minute to index on 2026-09-25.
          for ATTEMPT in {1..60}; do
            REGISTRY_VERSION="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
            if test "${REGISTRY_VERSION}" = "${VERSION}"; then
              break
            fi
            echo "Registry has not indexed ${NAME}@${VERSION} yet (attempt ${ATTEMPT}/60)."
            sleep 10
          done
          test "${REGISTRY_VERSION}" = "${VERSION}"
          node scripts/clean-install-canary.mjs "${NAME}@${VERSION}"
