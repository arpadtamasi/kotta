id: interface
version: 1
directory: interfaces
canonical_source: Design by Contract
description: A boundary whose obligations are stated as preconditions, postconditions, and invariants.
identity:
  prefix: IF
  format: "<prefix>-<26-character lowercase Crockford ULID>"
  filename: "<slug>-<last 8 id characters>.md"
required_fields:
  frontmatter: [id, form, title]
  body_headings: [Purpose, Preconditions, Postconditions, Invariants, Failures]
required_edges:
  - name: reference
    direction: incoming
    fields: [interfaces]
    source_forms: [use-case, entity]
    target_forms: [interface]
    minimum: 1
    question: Who uses this interface?
recognition_signals:
  - Two components or organizations exchange data or calls.
  - Inputs, outputs, errors, or caller and provider obligations need agreement.
  - An API, event, file, command, or service boundary is being specified.
