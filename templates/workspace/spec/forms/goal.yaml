id: goal
version: 1
directory: goals
canonical_source: Impact Mapping
description: A measurable outcome the product or initiative is intended to create.
identity:
  prefix: G
  format: "<prefix>-<26-character lowercase Crockford ULID>"
  filename: "<slug>-<last 8 id characters>.md"
required_fields:
  frontmatter: [id, form, title]
  body_headings: [Outcome, Context, Baseline and target]
required_edges:
  - name: measurement
    direction: outgoing
    fields: [measured_by]
    source_forms: [goal]
    target_forms: [example, quality-attribute]
    minimum: 1
    question: How will we know this goal was reached?
recognition_signals:
  - A desired business or user outcome is named.
  - Success, impact, a baseline, or a target is discussed.
  - A proposed feature is justified by the change it should produce.
